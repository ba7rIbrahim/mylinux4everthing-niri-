# Font Configuration
font_size 11.0

# Window Configuration
window_padding_width 12
background_opacity 0.8
# background_opacity 0.7
dynamic_background_opacity yes
background_blur 0
hide_window_decorations yes

# Cursor Configuration
cursor_shape beam
cursor_blink_interval 1

# Scrollback
scrollback_lines 3000

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Key bindings for common actions
map ctrl+shift+n new_window
map ctrl+shift+t new_tab

# Move between tabs (ctrl+l = right, ctrl+h = left)
map ctrl+l next_tab
map ctrl+h previous_tab


map ctrl+x close_tab 

# Jump directly to tab by number
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
map ctrl+6 goto_tab 6
map ctrl+7 goto_tab 7
map ctrl+8 goto_tab 8
map ctrl+9 goto_tab 9

# Rename the current tab (empty title resets to default)
map ctrl+shift+i set_tab_title

map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0 123431 1343124134 1234132 4134  s

# Tab configuration
tab_bar_style powerline
tab_bar_align left

# Shell integration
shell_integration enabled

# Dank color generation
include dank-tabs.conf
# include dank-theme.conf
